<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SysVoos — Buscador de Passagens</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#070707;--surf:#0e0e0e;--surf2:#151515;--surf3:#1b1b1b;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);
  --red:#d92020;--red-dim:rgba(217,32,32,0.13);--red-glow:rgba(217,32,32,0.25);
  --text:#efefef;--muted:#505050;--muted2:#333;
  --green:#27ae60;--radius:10px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(255,255,255,0.013) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,0.013) 1px,transparent 1px);
  background-size:52px 52px;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:-100px;left:-100px;width:400px;height:400px;
  background:radial-gradient(circle,rgba(217,32,32,0.07) 0%,transparent 65%);
  pointer-events:none;z-index:0}

.wrap{max-width:880px;margin:0 auto;padding:0 24px;position:relative;z-index:1}

header{padding:22px 0;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);animation:fadeDown .4s ease both}
.logo{display:flex;align-items:center;gap:10px;
  font-family:'Bebas Neue',sans-serif;font-size:1.55rem;letter-spacing:2px}
.logo-icon{width:32px;height:32px;background:var(--red);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:15px}
.logo em{font-style:normal;color:var(--red)}
.pill{font-size:.68rem;font-weight:500;color:var(--green);
  background:rgba(39,174,96,.08);border:1px solid rgba(39,174,96,.18);
  padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:5px}
.pill-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}

.hero{padding:46px 0 36px;animation:fadeDown .5s ease .05s both}
.hero-tag{font-size:.68rem;font-weight:500;color:var(--red);
  text-transform:uppercase;letter-spacing:3px;margin-bottom:12px}
.hero h1{font-family:'Bebas Neue',sans-serif;
  font-size:clamp(2.6rem,7vw,4.2rem);line-height:.95;letter-spacing:1px;margin-bottom:14px}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{color:var(--muted);font-size:.9rem;line-height:1.65;max-width:380px}

.block{background:var(--surf);border:1px solid var(--border);border-radius:14px;
  padding:26px 28px;margin-bottom:14px;animation:fadeUp .5s ease both}
.block:nth-child(1){animation-delay:.08s}
.block:nth-child(2){animation-delay:.16s}
.block:nth-child(3){animation-delay:.24s}
.block-title{font-family:'Bebas Neue',sans-serif;font-size:.95rem;letter-spacing:2px;
  color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.block-title::before{content:'';display:block;width:3px;height:13px;
  background:var(--red);border-radius:2px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.66rem;font-weight:500;color:var(--muted);
  text-transform:uppercase;letter-spacing:1px}
.field input,.field select{background:var(--surf2);border:1px solid var(--border2);
  border-radius:var(--radius);color:var(--text);font-family:'Outfit',sans-serif;
  font-size:.91rem;padding:10px 13px;outline:none;
  transition:border-color .2s,box-shadow .2s;width:100%;appearance:none}
.field input:focus,.field select:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-dim)}
.field input::placeholder{color:var(--muted2)}
.field input:disabled{color:var(--muted);cursor:not-allowed}
.field select option{background:#151515}

/* AIRPORT COMBO */
.airport-combo{position:relative}
.airport-combo input{padding-right:36px;cursor:pointer}
.ac-arrow{position:absolute;right:11px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:12px;pointer-events:none}
.ac-dropdown{position:absolute;top:calc(100% + 5px);left:0;right:0;
  background:var(--surf3);border:1px solid var(--border2);border-radius:10px;
  z-index:200;max-height:260px;overflow:hidden;display:none;
  box-shadow:0 12px 40px rgba(0,0,0,.6)}
.ac-dropdown.open{display:flex;flex-direction:column}
.ac-search{padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.ac-search input{background:var(--surf2);border:1px solid var(--border2);
  border-radius:7px;color:var(--text);font-family:'Outfit',sans-serif;
  font-size:.84rem;padding:7px 11px;outline:none;width:100%}
.ac-search input:focus{border-color:var(--red)}
.ac-list{overflow-y:auto;flex:1}
.ac-list::-webkit-scrollbar{width:4px}
.ac-list::-webkit-scrollbar-track{background:transparent}
.ac-list::-webkit-scrollbar-thumb{background:var(--muted2);border-radius:4px}
.ac-item{padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;
  transition:background .15s;font-size:.84rem}
.ac-item:hover,.ac-item.selected{background:var(--red-dim)}
.ac-code{font-family:'Bebas Neue',sans-serif;font-size:.95rem;letter-spacing:1px;
  color:var(--red);flex-shrink:0;width:36px}
.ac-name{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-country{color:var(--muted);font-size:.72rem;margin-left:auto;flex-shrink:0}
.ac-empty{padding:18px 14px;color:var(--muted);font-size:.82rem;text-align:center}

.ap-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:13px}
.ap-row .field{flex:1}
.swap-btn{width:38px;height:38px;flex-shrink:0;background:var(--surf2);
  border:1px solid var(--border2);border-radius:var(--radius);color:var(--muted);
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:color .2s,border-color .2s,transform .3s}
.swap-btn:hover{color:var(--red);border-color:var(--red);transform:rotate(180deg)}

.btn-primary{background:var(--red);border:none;border-radius:var(--radius);color:#fff;
  font-family:'Outfit',sans-serif;font-size:.86rem;font-weight:600;
  padding:11px 26px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:opacity .2s,transform .15s,box-shadow .2s;white-space:nowrap}
.btn-primary:hover{opacity:.87;transform:translateY(-1px);box-shadow:0 6px 22px var(--red-glow)}
.btn-primary:active{transform:none;opacity:1}
.btn-primary:disabled{opacity:.32;cursor:not-allowed;transform:none;box-shadow:none}
.btn-outline{background:transparent;border:1px solid var(--red);border-radius:var(--radius);
  color:var(--red);font-family:'Outfit',sans-serif;font-size:.86rem;font-weight:500;
  padding:10px 22px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:background .2s,box-shadow .2s;white-space:nowrap}
.btn-outline:hover{background:var(--red-dim);box-shadow:0 0 14px var(--red-dim)}
.btn-ghost{background:var(--surf2);border:1px solid var(--border2);border-radius:var(--radius);
  color:var(--text);font-family:'Outfit',sans-serif;font-size:.86rem;font-weight:500;
  padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:border-color .2s,color .2s;white-space:nowrap}
.btn-ghost:hover{border-color:var(--red);color:var(--red)}
.action-row{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin-top:18px}
.divider{height:1px;background:var(--border);margin:18px 0}

.tags-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.email-tag{background:var(--surf2);border:1px solid var(--border2);border-radius:999px;
  color:var(--muted);font-size:.76rem;padding:4px 9px 4px 13px;
  display:flex;align-items:center;gap:7px}
.email-tag .rm{background:none;border:none;cursor:pointer;color:var(--muted2);
  font-size:14px;line-height:1;transition:color .2s;padding:0}
.email-tag .rm:hover{color:var(--red)}

.loader{display:none;flex-direction:column;align-items:center;gap:16px;padding:60px 0}
.loader.on{display:flex;animation:fadeUp .35s ease}
.spinner{width:42px;height:42px;border:2px solid var(--surf3);
  border-top-color:var(--red);border-radius:50%;animation:spin .75s linear infinite}
.loader-msg{color:var(--muted);font-size:.84rem}

.phase-bar{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.phase-step{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--muted)}
.phase-step.active{color:var(--red)}
.phase-step.done{color:var(--green)}
.phase-num{width:20px;height:20px;border-radius:50%;border:1px solid currentColor;
  display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:600;flex-shrink:0}
.phase-line{flex:1;height:1px;background:var(--border)}

.results-wrap{animation:fadeUp .4s ease}
.results-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.results-heading{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:1.5px}
.results-count{font-size:.76rem;color:var(--muted)}

.section-lbl{font-family:'Bebas Neue',sans-serif;font-size:.88rem;letter-spacing:2px;
  color:var(--muted);display:flex;align-items:center;gap:8px;margin:18px 0 10px}
.section-lbl::after{content:'';flex:1;height:1px;background:var(--border)}

.fcard{background:var(--surf);border:1px solid var(--border);border-radius:12px;
  margin-bottom:9px;overflow:hidden;transition:border-color .2s}
.fcard:hover{border-color:rgba(217,32,32,.2)}
.fcard-head{display:flex;align-items:center;padding:15px 19px;gap:14px;cursor:pointer}
.al-icon{width:36px;height:36px;flex-shrink:0;background:var(--surf2);
  border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden}
.al-icon img{width:28px;height:28px;object-fit:contain}
.al-name{font-weight:500;font-size:.86rem}
.al-num{font-size:.7rem;color:var(--muted);margin-top:1px}
.route{flex:1;display:flex;align-items:center;justify-content:center;gap:11px}
.rt-time{text-align:center}
.rt-val{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px}
.rt-code{font-size:.68rem;color:var(--muted);margin-top:1px}
.rt-line{flex:1;max-width:100px;display:flex;flex-direction:column;align-items:center;gap:3px}
.rt-dur{font-size:.66rem;color:var(--muted)}
.rt-bar{width:100%;display:flex;align-items:center}
.rt-bar::before,.rt-bar::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--red);flex-shrink:0}
.rt-inner{flex:1;height:1px;background:var(--muted2)}
.rt-stops{font-size:.63rem;color:var(--muted)}
.rt-stops.direct{color:var(--green)}
.price-box{text-align:right}
.price-val{font-family:'Bebas Neue',sans-serif;font-size:1.45rem;letter-spacing:1px;color:var(--red)}
.price-lbl{font-size:.63rem;color:var(--muted);margin-top:1px}
.chev{color:var(--muted);font-size:13px;transition:transform .3s;flex-shrink:0}
.fcard.open .chev{transform:rotate(180deg)}
.fcard-detail{display:none;padding:0 19px 18px;border-top:1px solid var(--border)}
.fcard.open .fcard-detail{display:block}

.btn-select{background:var(--red-dim);border:1px solid rgba(217,32,32,.3);
  border-radius:8px;color:var(--red);font-family:'Outfit',sans-serif;
  font-size:.76rem;font-weight:500;padding:6px 14px;cursor:pointer;
  transition:background .2s;white-space:nowrap;flex-shrink:0}
.btn-select:hover{background:rgba(217,32,32,.22)}
.btn-select.chosen{background:rgba(39,174,96,.1);border-color:rgba(39,174,96,.3);color:var(--green)}

.seg-block{margin-top:15px}
.seg-lbl{font-size:.63rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);
  margin-bottom:9px;display:flex;align-items:center;gap:6px}
.seg-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.info-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.ii{background:var(--surf2);border-radius:8px;padding:9px 12px}
.ii-lbl{font-size:.61rem;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.8px}
.ii-val{font-size:.83rem;font-weight:500}
.ii-sub{font-size:.69rem;color:var(--muted);margin-top:2px}
.lay-tag{display:inline-flex;align-items:center;gap:5px;margin:10px 0;
  font-size:.71rem;color:var(--muted);background:var(--surf2);
  border:1px solid var(--border);padding:4px 13px;border-radius:999px}
.lay-tag span{color:var(--red)}

.return-section{background:var(--surf);border:1px solid var(--border);border-radius:14px;
  padding:22px 24px;margin-bottom:14px;animation:fadeUp .4s ease}
.return-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.return-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;color:var(--muted);
  display:flex;align-items:center;gap:8px}
.return-title::before{content:'';display:block;width:3px;height:13px;background:var(--green);border-radius:2px}

.state{text-align:center;padding:56px 0}
.state-icon{font-size:38px;margin-bottom:12px}
.state-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px;margin-bottom:6px}
.state-desc{font-size:.82rem;color:var(--muted)}

.toast{position:fixed;bottom:22px;right:22px;background:var(--surf);
  border:1px solid var(--border2);border-radius:10px;padding:11px 16px;
  font-size:.8rem;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:999;max-width:310px;
  animation:slideUp .3s ease}
.toast.err{border-color:rgba(217,32,32,.3)}
.toast.ok{border-color:rgba(39,174,96,.3)}
.toast.hide{display:none}

@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

@media(max-width:660px){
  .g2,.g3{grid-template-columns:1fr}
  .route{display:none}
  .info-row{grid-template-columns:1fr 1fr}
  .hero h1{font-size:2.8rem}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo"><div class="logo-icon">✈</div>SYS<em>VOOS</em></div>
  <div class="pill"><div class="pill-dot"></div>SysTech Tecnologia</div>
</header>

<section class="hero">
  <div class="hero-tag">Monitoramento de Passagens</div>
  <h1>Busca de<br/><em>Passagens</em></h1>
  <p>Selecione origem, destino e datas — encontramos os voos de ida e volta completos.</p>
</section>

<!-- BUSCA -->
<div class="block">
  <div class="block-title">Configurar Busca</div>

  <div class="ap-row">
    <div class="field">
      <label>Origem</label>
      <div class="airport-combo" id="combo-origin">
        <input type="text" id="origin-display" placeholder="Selecione o aeroporto..." readonly/>
        <input type="hidden" id="origin-val" value="BSB"/>
        <span class="ac-arrow">▾</span>
        <div class="ac-dropdown" id="dd-origin">
          <div class="ac-search"><input type="text" placeholder="Buscar aeroporto..." id="search-origin"/></div>
          <div class="ac-list" id="list-origin"></div>
        </div>
      </div>
    </div>
    <button class="swap-btn" onclick="swapAirports()" title="Trocar">⇆</button>
    <div class="field">
      <label>Destino</label>
      <div class="airport-combo" id="combo-dest">
        <input type="text" id="dest-display" placeholder="Selecione o aeroporto..." readonly/>
        <input type="hidden" id="dest-val" value="POA"/>
        <span class="ac-arrow">▾</span>
        <div class="ac-dropdown" id="dd-dest">
          <div class="ac-search"><input type="text" placeholder="Buscar aeroporto..." id="search-dest"/></div>
          <div class="ac-list" id="list-dest"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="g3" style="margin-bottom:13px">
    <div class="field">
      <label>Data de Ida</label>
      <input type="date" id="outboundDate" value="2026-10-08"/>
    </div>
    <div class="field">
      <label>Data de Volta</label>
      <input type="date" id="returnDate" value="2026-10-13"/>
    </div>
    <div class="field">
      <label>Tipo</label>
      <select id="tripType" onchange="onTripTypeChange()">
        <option value="1" selected>Ida e Volta</option>
        <option value="2">Somente Ida</option>
      </select>
    </div>
  </div>

  <div class="g3">
    <div class="field">
      <label>Paradas</label>
      <select id="stops">
        <option value="0">Direto</option>
        <option value="1">1 Parada</option>
        <option value="2" selected>Até 2 Paradas</option>
        <option value="3">Qualquer</option>
      </select>
    </div>
    <div class="field">
      <label>Moeda</label>
      <select id="currency">
        <option value="BRL" selected>BRL — R$</option>
        <option value="USD">USD — $</option>
      </select>
    </div>
    <div class="field">
      <label>Ordenar por</label>
      <select id="sortBy">
        <option value="1">Menor Preço</option>
        <option value="2" selected>Duração</option>
      </select>
    </div>
  </div>

  <div class="action-row">
    <button class="btn-primary" id="searchBtn" onclick="startSearch()">✦ Buscar Voos</button>
  </div>
</div>

<!-- EMAIL -->
<div class="block">
  <div class="block-title">Destinatários do E-mail</div>
  <div class="g2">
    <div class="field">
      <label>Adicionar destinatário</label>
      <div style="display:flex;gap:8px">
        <input type="email" id="newEmail" placeholder="email@exemplo.com"/>
        <button class="btn-ghost" onclick="addEmail()">+</button>
      </div>
    </div>
    <div></div>
  </div>
  <div class="tags-wrap" id="emailTags"></div>
  <div class="divider"></div>
  <div style="display:flex;justify-content:flex-end">
    <button class="btn-outline" id="sendEmailBtn" onclick="sendEmail()">✉ Enviar por E-mail</button>
  </div>
</div>

<!-- LOADER -->
<div class="loader" id="loader">
  <div class="spinner"></div>
  <div class="loader-msg" id="loaderMsg">Buscando voos de ida…</div>
</div>

<!-- RESULTS -->
<div id="resultsArea"></div>
<div style="height:48px"></div>
</div>

<div class="toast hide" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   URL DO BACKEND — troque pela URL do Render depois do deploy
═══════════════════════════════════════════════════════════ */
const API_URL = "https://sysvoos.onrender.com/"; // ← ATUALIZAR após deploy no Render

/* ═══════════════════════════════════════════════════════════
   AEROPORTOS
═══════════════════════════════════════════════════════════ */

  {code:"MAO",name:"Eduardo Gomes",city:"Manaus",country:"BR"},

  {code:"THE",name:"Senador Petrônio Portella",city:"Teresina",country:"BR"},
  {code:"SLZ",name:"Marechal Cunha Machado",city:"São Luís",country:"BR"},
  {code:"AJU",name:"Santa Maria",city:"Aracaju",country:"BR"},
  {code:"VIX",name:"Eurico de Aguiar Salles",city:"Vitória",country:"BR"},

let emailList        = ["leonardo.costa@systechtecnologia.com.br","jennifer@systechtecnologia.com.br"];

let returnFlights    = [];
let selectedOutbound = null;
let isRoundTrip      = true;
let lastSearchParams = {};

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
initCombo('origin','BSB');
initCombo('dest','POA');

function onTripTypeChange(){
  isRoundTrip = document.getElementById('tripType').value === '1';
  document.getElementById('returnDate').disabled = !isRoundTrip;
}

/* ═══════════════════════════════════════════════════════════
   AIRPORT COMBO
═══════════════════════════════════════════════════════════ */
function initCombo(id, defaultCode){
  const display  = document.getElementById(`${id}-display`);
  const hidden   = document.getElementById(`${id}-val`);
  const dropdown = document.getElementById(`dd-${id}`);
  const searchIn = document.getElementById(`search-${id}`);
  const listEl   = document.getElementById(`list-${id}`);

  const def = AIRPORTS.find(a=>a.code===defaultCode);
  if(def){ display.value=`${def.code} — ${def.city}`; hidden.value=def.code; }

  display.addEventListener('click',()=>{
    const isOpen = dropdown.classList.contains('open');
    closeAllDropdowns();
    if(!isOpen){
      dropdown.classList.add('open');
      searchIn.value='';
      renderList(listEl, AIRPORTS, hidden.value, a=>selectAirport(id,a));
      setTimeout(()=>searchIn.focus(),50);
    }
  });

  searchIn.addEventListener('input',()=>{
    const q = searchIn.value.toLowerCase();
    const filtered = q.length < 1 ? AIRPORTS
      : AIRPORTS.filter(a=>
          a.code.toLowerCase().includes(q)||
          a.name.toLowerCase().includes(q)||
          a.city.toLowerCase().includes(q)||
          a.country.toLowerCase().includes(q));
    renderList(listEl, filtered, hidden.value, a=>selectAirport(id,a));
  });

  dropdown.addEventListener('mousedown',e=>e.preventDefault());
}

function renderList(el, airports, selectedCode, onSelect){
  if(!airports.length){
    el.innerHTML='<div class="ac-empty">Nenhum aeroporto encontrado</div>';
    return;
  }
  el.innerHTML = airports.map(a=>`
    <div class="ac-item${a.code===selectedCode?' selected':''}" data-code="${a.code}">
      <span class="ac-code">${a.code}</span>
      <span class="ac-name">${a.name} — ${a.city}</span>
      <span class="ac-country">${a.country}</span>
    </div>`).join('');
  el.querySelectorAll('.ac-item').forEach(item=>{
    item.addEventListener('click',()=>{
      const airport = AIRPORTS.find(a=>a.code===item.dataset.code);
      onSelect(airport);
    });
  });
}

function selectAirport(id, airport){
  document.getElementById(`${id}-display`).value=`${airport.code} — ${airport.city}`;
  document.getElementById(`${id}-val`).value=airport.code;
  closeAllDropdowns();
}

function closeAllDropdowns(){
  document.querySelectorAll('.ac-dropdown').forEach(d=>d.classList.remove('open'));
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.airport-combo')) closeAllDropdowns();
});

function swapAirports(){
  const ov=document.getElementById('origin-val').value;
  const od=document.getElementById('origin-display').value;
  const dv=document.getElementById('dest-val').value;
  const dd=document.getElementById('dest-display').value;
  document.getElementById('origin-val').value=dv;
  document.getElementById('origin-display').value=dd;
  document.getElementById('dest-val').value=ov;
  document.getElementById('dest-display').value=od;
}

function addEmail(){
  const inp=document.getElementById('newEmail');
  const val=inp.value.trim();
  if(!val||!val.includes('@')) return showToast('E-mail inválido','err');
  if(emailList.includes(val)) return showToast('E-mail já adicionado','err');
  emailList.push(val); inp.value=''; renderTags();
}
function removeEmail(e){ emailList=emailList.filter(x=>x!==e); renderTags(); }
function renderTags(){
  document.getElementById('emailTags').innerHTML=emailList.map(e=>`
    <div class="email-tag">${e}
      <button class="rm" onclick="removeEmail('${e}')">×</button>
    </div>`).join('');
}

/* ═══════════════════════════════════════════════════════════
   SEARCH — STEP 1: VOOS DE IDA → POST /api/search
═══════════════════════════════════════════════════════════ */
async function startSearch(){
  const origin   = document.getElementById('origin-val').value;
  const dest     = document.getElementById('dest-val').value;
  const outbound = document.getElementById('outboundDate').value;
  const ret      = document.getElementById('returnDate').value;
  const tripType = document.getElementById('tripType').value;
  const stops    = document.getElementById('stops').value;
  const currency = document.getElementById('currency').value;
  const sortBy   = document.getElementById('sortBy').value;
  isRoundTrip    = tripType === '1';

  if(!origin||!dest)    return showToast('Selecione origem e destino','err');
  if(!outbound)         return showToast('Informe a data de ida','err');
  if(isRoundTrip&&!ret) return showToast('Informe a data de volta','err');

  outboundFlights  = [];
  returnFlights    = [];
  selectedOutbound = null;

  lastSearchParams = { origin, destination:dest, outbound_date:outbound,
                       return_date:ret, trip_type:tripType, stops, currency, sort_by:sortBy };

  document.getElementById('searchBtn').disabled = true;
  setLoader(true,'Buscando voos de ida…');
  document.getElementById('resultsArea').innerHTML='';

  try {
    const res  = await fetch(`${API_URL}/api/search`, {
      method:  'POST',
      headers: {'Content-Type':'application/json'},
      body:    JSON.stringify(lastSearchParams)
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);

    outboundFlights = data.flights || [];
    setLoader(false);

    const origInfo = AIRPORTS.find(a=>a.code===origin)||{code:origin,city:origin};
    const destInfo = AIRPORTS.find(a=>a.code===dest)  ||{code:dest,  city:dest};
    renderOutbound(outboundFlights, origInfo, destInfo, outbound, ret, isRoundTrip);

  } catch(err){
    setLoader(false);
    document.getElementById('resultsArea').innerHTML=`
      <div class="state"><div class="state-icon">✈</div>
      <div class="state-title">Erro na busca</div>
      <div class="state-desc">${err.message}</div></div>`;
    showToast('Erro: '+err.message,'err');
  } finally {
    document.getElementById('searchBtn').disabled=false;
  }
}

/* ═══════════════════════════════════════════════════════════
   SEARCH — STEP 2: VOOS DE VOLTA → POST /api/return
═══════════════════════════════════════════════════════════ */
async function fetchReturnFlights(departure_token){
  setLoader(true,'Buscando voos de volta…');

  try {
    const body = { ...lastSearchParams, departure_token };
    const res  = await fetch(`${API_URL}/api/return`, {
      method:  'POST',
      headers: {'Content-Type':'application/json'},
      body:    JSON.stringify(body)
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);

    returnFlights = data.flights || [];
    setLoader(false);

    const destInfo = AIRPORTS.find(a=>a.code===lastSearchParams.destination)||
                     {code:lastSearchParams.destination,city:lastSearchParams.destination};
    const origInfo = AIRPORTS.find(a=>a.code===lastSearchParams.origin)||
                     {code:lastSearchParams.origin,city:lastSearchParams.origin};
    renderReturnSection(returnFlights, destInfo, origInfo, lastSearchParams.return_date);

  } catch(err){
    setLoader(false);
    showToast('Erro ao buscar voos de volta: '+err.message,'err');
  }
}

/* ═══════════════════════════════════════════════════════════
   RENDER OUTBOUND
═══════════════════════════════════════════════════════════ */
function renderOutbound(flights, orig, dest, outDate, retDate, roundTrip){
  const area = document.getElementById('resultsArea');

  const phaseBar = roundTrip ? `
    <div class="phase-bar">
      <div class="phase-step active"><div class="phase-num">1</div>Selecione o voo de ida</div>
      <div class="phase-line"></div>
      <div class="phase-step" id="phase2"><div class="phase-num">2</div>Selecione o voo de volta</div>
    </div>` : '';

  if(!flights.length){
    area.innerHTML=`<div class="state"><div class="state-icon">🔍</div>
      <div class="state-title">Nenhum voo encontrado</div>
      <div class="state-desc">Tente outras datas ou mais paradas.</div></div>`;
    return;
  }

  const header=`
    <div class="results-wrap">
      <div class="results-header">
        <div class="results-heading">${orig.code} → ${dest.code} / ${fmtDate(outDate)}${roundTrip?` ← ${fmtDate(retDate)}`:''}</div>
        <div class="results-count">${flights.length} voo(s) de ida</div>
      </div>`;

  const cards = flights.map((fl,i)=>buildCard(fl,i,'out',roundTrip)).join('');
  area.innerHTML = header + phaseBar + `<div class="section-lbl">✈ Voos de Ida</div>` + cards + `</div>`;
}

/* ═══════════════════════════════════════════════════════════
   RENDER RETURN
═══════════════════════════════════════════════════════════ */
function renderReturnSection(flights, orig, dest, retDate){
  const ph2=document.getElementById('phase2');
  if(ph2) ph2.classList.add('active');

  const existing=document.getElementById('returnSection');
  if(existing) existing.remove();

  let html=`<div class="return-section" id="returnSection">
    <div class="return-header">
      <div class="return-title">Voos de Volta — ${orig.code} → ${dest.code} / ${fmtDate(retDate)}</div>
      <div class="results-count">${flights.length} opção(ões)</div>
    </div>`;

  html += flights.length
    ? flights.map((fl,i)=>buildCard(fl,i,'ret',false)).join('')
    : `<div class="state" style="padding:30px 0">
        <div class="state-icon">🔍</div>
        <div class="state-title">Nenhum voo de volta</div>
        <div class="state-desc">Tente selecionar outro voo de ida.</div>
       </div>`;

  html += `</div>`;
  document.getElementById('resultsArea').insertAdjacentHTML('beforeend', html);
  document.getElementById('returnSection').scrollIntoView({behavior:'smooth',block:'start'});
}

/* ═══════════════════════════════════════════════════════════
   BUILD CARD
═══════════════════════════════════════════════════════════ */
function buildCard(fl, i, prefix, showSelect){
  const segs  = fl.flights||[];
  const first = segs[0]||{}, last=segs[segs.length-1]||{};
  const layers= fl.layovers||[];
  const stops = segs.length-1;
  const depT  = fmtTime(first.departure_airport?.time);
  const arrT  = fmtTime(last.arrival_airport?.time);
  const depC  = first.departure_airport?.id||'—';
  const arrC  = last.arrival_airport?.id||'—';
  const stopsHtml = stops===0
    ? '<span class="rt-stops direct">Direto</span>'
    : `<span class="rt-stops">${stops} parada${stops>1?'s':''}</span>`;
  const logoUrl  = first.airline_logo||'';
  const logoHtml = logoUrl
    ? `<img src="${logoUrl}" alt="" onerror="this.style.display='none'"/>`
    : airlineIcon(first.airline);

  const selBtn = showSelect
    ? `<button class="btn-select" id="sel-out-${i}" onclick="selectOutbound(${i})">Selecionar ida</button>`
    : '';

  let detail='';
  segs.forEach((seg,si)=>{
    detail+=`
      <div class="seg-block">
        <div class="seg-lbl">${airlineIcon(seg.airline)} Trecho ${si+1} — ${seg.airline||'—'} ${seg.flight_number||''}</div>
        <div class="info-row">
          <div class="ii">
            <div class="ii-lbl">Partida</div>
            <div class="ii-val">${seg.departure_airport?.name||'—'} (${seg.departure_airport?.id||'—'})</div>
            <div class="ii-sub">${seg.departure_airport?.time||'—'}</div>
          </div>
          <div class="ii">
            <div class="ii-lbl">Chegada</div>
            <div class="ii-val">${seg.arrival_airport?.name||'—'} (${seg.arrival_airport?.id||'—'})</div>
            <div class="ii-sub">${seg.arrival_airport?.time||'—'}</div>
          </div>
          <div class="ii">
            <div class="ii-lbl">Duração / Aeronave</div>
            <div class="ii-val">${seg.duration?fmt(seg.duration):'—'}</div>
            <div class="ii-sub">${seg.airplane||''}</div>
          </div>
        </div>
      </div>`;
    if(layers[si]){
      const l=layers[si];
      detail+=`<div class="lay-tag">⏱ Escala: <span>${l.name} (${l.id})</span> — ${fmt(l.duration)}</div>`;
    }
  });

  return `
    <div class="fcard" id="fc-${prefix}-${i}">
      <div class="fcard-head" onclick="toggleCard('${prefix}',${i})">
        <div class="al-icon">${logoHtml}</div>
        <div style="flex:0 0 auto;margin-right:4px">
          <div class="al-name">${first.airline||'—'}</div>
          <div class="al-num">${first.flight_number||''}</div>
        </div>
        <div class="route">
          <div class="rt-time">
            <div class="rt-val">${depT}</div>
            <div class="rt-code">${depC}</div>
          </div>
          <div class="rt-line">
            <div class="rt-dur">${fl.total_duration?fmt(fl.total_duration):'—'}</div>
            <div class="rt-bar"><div class="rt-inner"></div></div>
            ${stopsHtml}
          </div>
          <div class="rt-time">
            <div class="rt-val">${arrT}</div>
            <div class="rt-code">${arrC}</div>
          </div>
        </div>
        ${selBtn}
        <div class="price-box">
          <div class="price-val">${fl.price?'R$\u202f'+fl.price.toLocaleString('pt-BR'):'—'}</div>
          <div class="price-lbl">por pessoa</div>
        </div>
        <div class="chev">▾</div>
      </div>
      <div class="fcard-detail">${detail}</div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════
   SELECT OUTBOUND
═══════════════════════════════════════════════════════════ */
function selectOutbound(i){
  const fl=outboundFlights[i];
  if(!fl) return;
  selectedOutbound=fl;

  document.querySelectorAll('[id^="sel-out-"]').forEach(b=>{
    b.textContent='Selecionar ida'; b.classList.remove('chosen');
  });
  const btn=document.getElementById(`sel-out-${i}`);
  if(btn){ btn.textContent='✓ Selecionado'; btn.classList.add('chosen'); }

  const token=fl.departure_token;
  if(!token){ showToast('departure_token não disponível para este voo','err'); return; }
  fetchReturnFlights(token);
}

/* ═══════════════════════════════════════════════════════════
   SEND EMAIL → POST /api/send-email
═══════════════════════════════════════════════════════════ */
async function sendEmail(){
  if(!outboundFlights.length) return showToast('Busque voos primeiro','err');
  if(!emailList.length)       return showToast('Adicione pelo menos um destinatário','err');

  const btn=document.getElementById('sendEmailBtn');
  btn.disabled=true;
  btn.textContent='Enviando…';

  const origin  = lastSearchParams.origin||'';
  const dest    = lastSearchParams.destination||'';
  const outdate = lastSearchParams.outbound_date||'';
  const retdate = lastSearchParams.return_date||'';

  try {
    const res = await fetch(`${API_URL}/api/send-email`, {
      method:  'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        to_emails:        emailList,
        subject:          `Voos ${origin} → ${dest} — ${outdate}${retdate?' a '+retdate:''}`,
        outbound_flights: outboundFlights.slice(0,10).map(mapFlight),
        return_flights:   returnFlights.slice(0,10).map(mapFlight),
        selected_outbound: selectedOutbound ? mapFlight(selectedOutbound) : null,
      })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    showToast(`E-mail enviado para ${emailList.length} destinatário(s) ✓`,'ok');
  } catch(err){
    showToast('Erro ao enviar: '+err.message,'err');
  } finally {
    btn.disabled=false;
    btn.textContent='✉ Enviar por E-mail';
  }
}

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
function toggleCard(prefix,i){ document.getElementById(`fc-${prefix}-${i}`).classList.toggle('open'); }
const fmt    = m=>`${Math.floor(m/60)}h ${m%60}m`;
const fmtTime= dt=>{ if(!dt) return '—'; const p=dt.split(' '); return p[1]?p[1].slice(0,5):dt; };
const fmtDate= d=>{ if(!d) return ''; return d.split('-').reverse().join('/'); };
function airlineIcon(n){
  if(!n) return '✈'; const l=n.toLowerCase();
  if(l.includes('gol'))   return '🟠';
  if(l.includes('latam')) return '🔴';
  if(l.includes('azul'))  return '🔵';
  return '✈';
}
function setLoader(on,msg=''){
  document.getElementById('loader').classList.toggle('on',on);
  if(msg) document.getElementById('loaderMsg').textContent=msg;
}
function mapFlight(fl){
  return {
    price:         fl.price,
    total_duration:fl.total_duration,
    airline:       fl.flights?.[0]?.airline,
    flight_number: fl.flights?.[0]?.flight_number,
    departure:     fl.flights?.[0]?.departure_airport,
    arrival:       fl.flights?.[fl.flights?.length-1]?.arrival_airport,
    stops:         (fl.flights?.length||1)-1,
    layovers:      fl.layovers||[]
  };
}
function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=(type==='ok'?'✓  ':'✕  ')+msg;
  t.className=`toast ${type}`;
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.className='toast hide',4000);
}
